<nav class="top-nav" *ngIf="showNavbar">
  <div class="nav-links">
    <a routerLink="/presentation" routerLinkActive="active">Home</a>
    <a routerLink="/schedule" routerLinkActive="active">Schedule</a>
    <a routerLink="/sessions" routerLinkActive="active">My Sessions</a>
    <a>Statistics</a>
  </div>
  <div class="user-menu">
    <span>Welcome, {{ currentUser }}</span>
    <button class="logout-btn" (click)="logout()">
      Logout
    </button>
  </div>
</nav>

<main class="content-area">
  <router-outlet></router-outlet>
</main>

<div class="floating-chat-container" *ngIf="showNavbar">
  <button class="chat-toggle-btn" (click)="isChatOpen = !isChatOpen">
    💬 {{ isChatOpen ? 'Close Chat' : 'Studio Chat' }}
  </button>
  
  <div class="chat-popup" *ngIf="isChatOpen">
    <div class="chat-header-bar">
      <h3>Studio Live Chat</h3>
      <button (click)="isChatOpen = false">✕</button>
    </div>
    
    <div class="chat-window">
      <div *ngFor="let msg of chatMessages" 
           class="chat-bubble" 
           [ngClass]="{'my-message': msg.sender === currentUser, 'their-message': msg.sender !== currentUser}">
        <div class="chat-header">
          <strong>{{ msg.sender }}</strong> 
          <span class="chat-time">{{ msg.timestamp }}</span>
        </div>
        <div class="chat-text">{{ msg.text }}</div>
      </div>
    </div>

    <div class="chat-controls">
      <input type="text" [(ngModel)]="chatInput" placeholder="Type a message..." (keyup.enter)="sendMessage()">
      <button (click)="sendMessage()">Send</button>
    </div>
  </div>
</div>
